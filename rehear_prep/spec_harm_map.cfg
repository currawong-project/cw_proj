{
  base_dir:    "~/src/cw_proj/rehear_prep/io",
  io_dict:     "~/src/cw_proj/rehear_prep/io.cfg",               // Runtime configuration file.
  proc_dict:   "~/src/caw/src/libcw/src/flow/rsrc/proc_dict.cfg", // Processor class definition file.
  udp_dict:    "~/src/caw/src/libcw/src/flow/rsrc/udp_dict.cfg",  // User defined proc files
  log: { flags:[ date_time, file_out, console, overwrite_file ], level:info, log_filename:"~/temp/caw_log.txt", queue_blk_cnt:16, queue_blk_byte_cnt:4096 }
  tracer: {  trace_cnt:1024, msg_cnt: 1024000, enable_fl:false, activate_fl:false, out_fname:"~/temp/caw_trace/trace" }
    
  programs: {

    gutim_3_simul_1: {
      network: {
        procs: {

	   meas: { class: number, args: { in:1, out_type:uint }, ui:{ create_fl:true } }

	   tlp: { class: timeline_player, in:{ go_meas:meas.out },
	                                  args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/tl_play.json" }, ui:{ create_fl:true} },

           spirio_vt:{ class: vel_table, in:{ in:tlp.out }, args:{ vel_tbl_fname:"$/../vel_table_perf.json", vel_tbl_label:"spirio_1" }},
           vt_rt: { class:recd_route, in:{ in:spirio_vt.out }, args:{ out_cnt:3, sel_field:"port_id" }  },

           //sp_tlp_m_out_a: { class: midi_out, in:{ rin:vt_rt.out0 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-01" }, ui:{ create_fl:true} },
           //sp_tlp_m_out_b: { class: midi_out, in:{ rin:vt_rt.out1 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-02" }, ui:{ create_fl:true} },
           //sp_tlp_m_out_c: { class: midi_out, in:{ rin:vt_rt.out2 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-03" }, ui:{ create_fl:true} },

           tlp_m_out_a: { class: midi_out, in:{ rin:vt_rt.out0 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"Midi Through", port_label:"Midi Through Port-0" }, ui:{ create_fl:true} },
           tlp_m_out_b: { class: midi_out, in:{ rin:vt_rt.out1 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"Midi Through", port_label:"Midi Through Port-1" }, ui:{ create_fl:true} },
           tlp_m_out_c: { class: midi_out, in:{ rin:vt_rt.out2 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"Midi Through", port_label:"Midi Through Port-2" }, ui:{ create_fl:true} },

           m_in_a: { class: midi_in, args:{ port_id:0, print_fl:false, dev_label:"Midi Through", port_label:"Midi Through Port-0" }, ui:{create_fl:true} },
           m_in_b: { class: midi_in, args:{ port_id:1, print_fl:false, dev_label:"Midi Through", port_label:"Midi Through Port-1" }, ui:{create_fl:true} },
           m_in_c: { class: midi_in, args:{ port_id:2, print_fl:false, dev_label:"Midi Through", port_label:"Midi Through Port-2" }, ui:{create_fl:true} },

           m_in: { class:midi_in, args: { print_fl:true, dev_label:"Scarlett 18i20 USB",  port_label:"Scarlett 18i20 USB MIDI 1" } },
	   pbend: { class:midi_fourteen, in:{ in:m_in.r_out }, log:{ verbosity:all, varL: [ out ]}  }
	   pbend_fmt: { class:recd_rename, in:{ in:pbend.out }, args:{ out_fmt:{ fmt:{ fields:{value:trigger_id}}}}}

	   pb_pr: { class:print, in:{ in0:pbend_fmt.out }, args:{ text:["r:",""], verbosity:all } }
	   
           r_pass: { class:recd_pass, args:{ fmt:{ alloc_cnt:1024, fields:{ trigger_id:{type:uint, doc:"KSM 'trigger_id'"} } } } }


	   trig_merge: { class:recd_merge, in:{ in0:pbend_fmt.out, in1:r_pass.out } }
	   
           spirio_mp: { class: multi_player,
	                  // in: { r_play_id:r_pass.out },
			  in: { r_play_id:trig_merge.out },
                       	  args:{ cfg_fname:"/home/kevin/src/currawong/projects/gutim/gutim_2/spirio_mp.json",
			         r_play_field:"trigger_id",
                                 start_label:"",
				 restart_fl:false,
                                 play_excl_id:-1 },                            
                          ui: { create_fl:true } },


	   // make the Spirio MP record type conform to the 'midi_in' record type
           spirio_mp_fmt: { class:recd_rename, in:{ in:spirio_mp.out }, args:{ out_fmt:{ fmt:{ fields:{mp_port_id:port_id}}}}},
	   
	   // split the Spirio MP records by 'port-id'
           mp_route: { class:recd_route, in:{ in:spirio_mp_fmt.out }, args:{ out_cnt:3, sel_field:"port_id" }  },

	   // Send the Spirio MP records to the MIDI out port
           //sp_out_a: { class:midi_out, in:{ rin:mp_route.out0 }, args: { print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-01" }, ui:{ create_fl:false} },
           //sp_out_b: { class:midi_out, in:{ rin:mp_route.out1 }, args: { print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-02" }, ui:{ create_fl:false} },
           //sp_out_c: { class:midi_out, in:{ rin:mp_route.out2 }, args: { print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-03" }, ui:{ create_fl:false} },

           //m_out_a: { class:midi_out, in:{ rin:mp_route.out0 }, args: { print_fl:false, dev_label:"UM-ONE",              port_label:"UM-ONE MIDI 1" },             ui:{ create_fl:false} },
           //m_out_b: { class:midi_out, in:{ rin:mp_route.out1 }, args: { print_fl:false, dev_label:"iRig MIDI 2",         port_label:"iRig MIDI 2 MIDI 1" },        ui:{ create_fl:false} },
           //m_out_c: { class:midi_out, in:{ rin:mp_route.out2 }, args: { print_fl:false, dev_label:"Scarlett 18i20 USB",  port_label:"Scarlett 18i20 USB MIDI 1" }, ui:{ create_fl:false} },

	   // merge incoming MIDI and Spirio MP 
           r_merge_a: { class:recd_merge, in:{ in0:m_in_a.r_out, in1:mp_route.out0 } }
           r_merge_b: { class:recd_merge, in:{ in0:m_in_b.r_out, in1:mp_route.out1 } }
           r_merge_c: { class:recd_merge, in:{ in0:m_in_c.r_out, in1:mp_route.out2 } }

           sf_a: { class:score_follower_2, in: { in:r_merge_a.out,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/score.csv",
                                                print_fl:false},                                                                                
                                  ui: { create_fl:true } },

	   sf_ctl_a: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_a.out, goto_meas:meas.out, sf_done_fl:sf_a.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_a.b_loc, sf_end_loc:sf_a.e_loc, sf_post_gap_sec:sf_a.post_gap_sec, sf_reset_fl:sf_a.reset_trigger },
					   ui: { create_fl:true } },

					   
           sf_b: { class:score_follower_2, in: { in:r_merge_b.out,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/score.csv",
					        print_fl:false},					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_b: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_b.out, goto_meas:meas.out, sf_done_fl:sf_b.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_b.b_loc, sf_end_loc:sf_b.e_loc, sf_post_gap_sec:sf_b.post_gap_sec, sf_reset_fl:sf_b.reset_trigger },
					   ui: { create_fl:true } },
					   

           sf_c: { class:score_follower_2, in: { in:r_merge_c.out,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/score.csv",
					        print_fl:false },					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_c: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_c.out, goto_meas:meas.out, sf_done_fl:sf_c.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_c.b_loc, sf_end_loc:sf_c.e_loc, sf_post_gap_sec:sf_c.post_gap_sec, sf_reset_fl:sf_c.reset_trigger },
					   ui: { create_fl:true } },


	   ksm: { class: key_state_monitor, in:{ in0:sf_a.out, in1:sf_b.out, in2:sf_c.out, reset:meas.out },
	                                  args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/monitor_state.json" },
					  out: { ksm.out:r_pass.in },
					  ui: { create_fl:true } }


	   // Merge the output of all the SFs
	   sf_merge: { class: recd_merge, in:{ in0:sf_a.out, in1:sf_b.out, in2:sf_c.out }  }

	   // Apply the sampler velocity table.
	   samp_vt:{ class: vel_table, in:{ in:sf_merge.out }, args:{ vel_tbl_fname:"$/../vel_table_perf.json", vel_tbl_label:"ivory" }},

	   
           vctl:   { class: poly_voice_ctl, in:{ in:samp_vt.out , reset:meas.out},
	                                    args:{ seg_cnt:3, midi_fld:"vt_midi", seg_idx_fld:"port_id", voice_cnt:150, prune_thresh:141 },
					    ui: { create_fl:true } },

	   ps_sel_a: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_a.loc_cnt, reset:meas.out },
	                                           preset:"init",
						   args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/presets.json" },
						   ui: { create_fl:true } },

	   ps_sel_b: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_b.loc_cnt, reset:meas.out },
	                                           preset:"init",
						   args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/presets.json" },
						   ui: { create_fl:true } },

	   ps_sel_c: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_c.loc_cnt, reset:meas.out },
	                                           preset:"init",
						   args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/presets.json" },
						   ui: { create_fl:true } },

	   ps_sel_merge: { class:recd_merge, in: { in0:ps_sel_a.out, in1:ps_sel_b.out, in2:ps_sel_c.out },
	                                     ui: { create_fl:true } }


	   ps: { class: emit_preset, in:{ ctl_in:ps_sel_merge.out, midi_in_:vctl.out_ },
	                                  ui: { create_fl:false } }

          // xform_igain:  { class: number,   args:{ in:1.0f }, ui: { create_fl:true, vars:{ out_type:{ sfx_id:0, title:"type", flags:[show]}} } },
          xform_igain:  { class: number,   args:{ in:1.0f }, ui: { create_fl:true } },

	  shm_igain:     { class: number, args:{ in:1.0f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_hnum:      { class: number, args:{ out_type:uint, in:1u }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_hgain:     { class: number, args:{ in:1.0f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_peak_gain: { class: number, args:{ in:1.0f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_stretch:   { class: number, args:{ in:3.1f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_expo:      { class: number, args:{ in:1.0f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_fb:        { class: number, args:{ in:0.9f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  shm_ogain:     { class: number, args:{ in:1.0f }, ui: { create_fl: true, vars:{ trigger:{flags:[hide]}, out_type:{flags:[hide]}, out:{flags:[hide]} } } },
	  
          voice_poly: {
            class: poly,
            in:   { count:vctl.voice_cnt },               
            args: { parallel_fl:true, thread_cnt:5 },

            network: {
              procs: {
                voc: { class:piano_voice, in:{ _.in:_.vctl.out_, _.reset:_.vctl.reset },
                                          out:{ _.done_fl:_.vctl.done_fl_ },
                                          args:{
					         //wtb_fname:"~/media/audio/syn_wt/syn_wt_0.json",
					         wtb_fname:"~/media/audio/wt6/wt_bank.json"
                                                 wtb_instr:"piano",
                                                 rls_coeff: 0.95,
						 rls_thresh:0.01 } },
						 
                g:     { class: audio_gain,       in:{ in:voc.out, gain:_.xform_igain.out }  },
                pva:   { class: pv_analysis,      in:{ in:g.out, enable:voc.gate_fl, _.wndSmpN:_.ps.wnd_smp_cnt_ },  args:{ wndSmpN:512, hopSmpN:128, hzFl:false  } },

		sd:    { class: spec_harm_map,    in:{ in:pva.out,
		                                       pitch:voc.pitch,
						       enable:voc.gate_fl,
						       _.igain:_.shm_igain.out,
						       _.hgain:_.shm_hgain.out,
						       _.hnum:_.shm_hnum.out,
						       _.peak_gain:_.shm_peak_gain.out,
						       _.stretch:_.shm_stretch.out,
						       _.expo:_.shm_expo.out,
						       _.hfeedback:_.shm_fb.out },
						  args: {bypass:false} },
		/*
		                                  args:{ igain:1.0,
						         peak_fl:true,
							 peak_gain:3,
							 stretch:3.1,
							 expo:1.0,
							 hfeedback:0.9,
							 bypass:false } }
							 */
							 /*
                sd:    { class: spec_dist,        in:{ in:pva.out,
                                                       enable:voc.gate_fl,
                                                       _.ceiling:_.ps.ceiling_,
                                                       _.expo:_.ps.expo_,
                                                       _.thresh:_.ps.thresh_,
                                                       _.upr:_.ps.upr_,
                                                       _.lwr:_.ps.lwr_,
                                                       _.mix:_.ps.mix_ },  preset:kc, args:{ bypass:false }   },
                				       */
						       
                pvs:   { class: pv_synthesis,     in:{ in:sd.out, enable:voc.gate_fl  } },

                cmp:   { class: compressor,       in:{ in:pvs.out,
                                                       enable:voc.gate_fl }, preset:kc, args:{ bypass:false, igain:4.0, ogain:1.0 }   },
						       
						       /*
                cmp:   { class: compressor,       in:{ in:pvs.out,
                                                       enable:voc.gate_fl,
                                                       _.igain:_.ps.c_igain_,
                                                       _.ogain:_.ps.c_ogain_ }, preset:kc, args:{ bypass:false }   },
						       
                ogain: { class: audio_gain,       in:{ in:cmp.out, _.gain:_.ps.dry_gain_ } },
						       */
                                                            
                ogain: { class: audio_gain,       in:{ in:pvs.out }, args:{gain:1.0} },
		

              }
            }
          }

	  wet_poly_mix_a: { class: audio_mix, in:{ in_:voice_poly.ogain0_50.out }    args:{ igain_:1.0 }},
	  wet_poly_mix_b: { class: audio_mix, in:{ in_:voice_poly.ogain50_50.out } args:{ igain_:1.0 }},
	  wet_poly_mix_c: { class: audio_mix, in:{ in_:voice_poly.ogain100_50.out } args:{ igain_:1.0 }},
	  
	  dry_poly_mix_a: { class: audio_mix, in:{ in_:voice_poly.voc0_50.out }    args:{ igain_:1.0 }},
	  dry_poly_mix_b: { class: audio_mix, in:{ in_:voice_poly.voc50_50.out } args:{ igain_:1.0 }},
	  dry_poly_mix_c: { class: audio_mix, in:{ in_:voice_poly.voc100_50.out } args:{ igain_:1.0 }},

          wd_bal:       { class: balance, args:{}},
          wet_bal_gain_a: { class: audio_gain, in:{ in:wet_poly_mix_a.out, gain:wd_bal.out }     },
          wet_bal_gain_b: { class: audio_gain, in:{ in:wet_poly_mix_b.out, gain:wd_bal.out }     },
          wet_bal_gain_c: { class: audio_gain, in:{ in:wet_poly_mix_c.out, gain:wd_bal.out }     },
	  
          dry_bal_gain_a: { class: audio_gain, in:{ in:dry_poly_mix_a.out, gain:wd_bal.inv_out } },
          dry_bal_gain_b: { class: audio_gain, in:{ in:dry_poly_mix_b.out, gain:wd_bal.inv_out } },
          dry_bal_gain_c: { class: audio_gain, in:{ in:dry_poly_mix_c.out, gain:wd_bal.inv_out } },

	  mstr_wet_gain:  { class: number, args:{ in:0.1f }, ui: { create_fl:true } },
          mstr_wet_out_a: { class: audio_gain, in:{ in:wet_bal_gain_a.out, gain:mstr_wet_gain.out } },
          mstr_wet_out_b: { class: audio_gain, in:{ in:wet_bal_gain_b.out, gain:mstr_wet_gain.out } },
          mstr_wet_out_c: { class: audio_gain, in:{ in:wet_bal_gain_c.out, gain:mstr_wet_gain.out } },
	  

	  mstr_dry_gain:  { class: number, args:{ in:0.1f }, ui: { create_fl:true } },
          mstr_dry_out_a: { class: audio_gain, in:{ in:dry_bal_gain_a.out, gain:mstr_dry_gain.out } },
          mstr_dry_out_b: { class: audio_gain, in:{ in:dry_bal_gain_b.out, gain:mstr_dry_gain.out } },
          mstr_dry_out_c: { class: audio_gain, in:{ in:dry_bal_gain_c.out, gain:mstr_dry_gain.out } },

	  //merge: { class: audio_merge, in: { in0:mstr_wet_out_a.out, in1:mstr_dry_out_a.out,
	  //                                   in2:mstr_wet_out_b.out, in3:mstr_dry_out_b.out,
          //				     in4:mstr_wet_out_c.out, in5:mstr_dry_out_c.out } },

	  //merge: { class: audio_merge, in: { in0:dry_poly_mix_a.out, in1:dry_poly_mix_b.out, in2:dry_poly_mix_c.out } },
	  
	  merge: { class: audio_merge, in: { in0:wet_poly_mix_a.out, in1:wet_poly_mix_b.out, in2:wet_poly_mix_c.out } },

	  /*
	  mix_a: { class: audio_mix, in:{ in0:mstr_wet_out_a.out, in1:mstr_dry_out_a.out}, args:{ igain_:0.5 }},
	  mix_b: { class: audio_mix, in:{ in0:mstr_wet_out_b.out, in1:mstr_dry_out_b.out}, args:{ igain_:0.5 }},
	  mix_c: { class: audio_mix, in:{ in0:mstr_wet_out_c.out, in1:mstr_dry_out_c.out}, args:{ igain_:0.5 }},
	  merge: { class: audio_merge, in: { in0:mix_a.out, in1:mix_b.out, in2:mix_c.out } },
	  */


	  sync_delay: { class: audio_delay, in: { in:merge.out }, args:{ delayMs:400 }},

	  aout: { class: audio_out,   in:{ in:sync_delay.out },   args:{ dev_label:"main"}, ui:{ create_fl:true } },	  
	
	}
      }
    }

  }
}  