{
  base_dir:    "~/src/cw_proj/rehear_prep/io",
  io_dict:     "~/src/cw_proj/rehear_prep/io.cfg",               // Runtime configuration file.
  proc_dict:   "~/src/caw/src/libcw/src/flow/rsrc/proc_dict.cfg", // Processor class definition file.

  udp_dict:    "~/src/caw/src/libcw/src/flow/rsrc/udp_dict.cfg",  // User defined proc files
  log: { flags:[ date_time, no_file_out, console, overwrite_file ], level:info, log_filename:"~/temp/caw_log.txt", queue_blk_cnt:16, queue_blk_byte_cnt:4096 }
  tracer: {  trace_cnt:1024, msg_cnt: 1024000, enable_fl:false, activate_fl:false, out_fname:"~/temp/caw_trace/trace" }

  programs:
  {
    spirio_trigger_0:
    {
      network:
      {
        procs:
        {
          null_r:      { class:recd_blank,  args:{ fmt:{ alloc_cnt:1024, fields:{ midi:{type:m3, doc:"midi"} } } } }

          // -----------------------------------------------------------------------------------------------------------------
          // UI Application
          //
 
          // MIDI in from the main application
          m_in_b:   {  class:midi_in, args:  { print_fl:false, dev_label:"iRig MIDI 2", port_label:"iRig MIDI 2 MIDI 1" }, ui: {create_fl:false} },

          // Stop button
          meas: { class:number,  args: { in:1, out_type:uint },
                                       ui: {create_fl:true, title_fl:false, vars:{ trigger:{flags:[hide]},
                                                                                         out:{flags:[hide]},
                                                                                    out_type:{flags:[hide]}
                                                                                          in:{title:"Starting Measure:"}
                                                                                           }}}

          // Stop button
          stop_btn: { class:number,  args: { in:23, out_type:uint },
                                       ui: {create_fl:true, title_fl:false, vars:{ in:{flags:[hide]},
                                                                                    out:{flags:[hide]},
                                                                               out_type:{flags:[hide]},
                                                                                trigger:{ title:"Stop All Players",
                                                                                          // add_class:"row_right_justify",
                                                                                          btn_title:"Stop" }
                                                                                } }}
                                                                                
          cc23_mm:  { class:make_midi, in:{ r_in:null_r.out, byte_a:stop_btn.out, make_fl:stop_btn.out }, args:{ ch:0, status:176, byte_b:0 } }

          // Advance button
          adv_btn: { class:number,  args: { in:23, out_type:uint },
                                       ui: {create_fl:true, title_fl:false, vars:{ in:{flags:[hide]},
                                                                                    out:{flags:[hide]},
                                                                               out_type:{flags:[hide]},
                                                                                trigger:{ title:"Advance triggers:",
                                                                                          // add_class:"row_right_justify",
                                                                                          btn_title:"Advance" }
                                                                                } }}


          // Convert incoming pitch-bend messages to measure locate messages
          //pbend_sel:{ class:midi_select,   in:{ in:m_in_b.out }, args:{ sel_status:224 } },
          //pbend_in: { class:midi_fourteen, in:{ in:pbend_sel.out } },
          //ui_meas: {  class: number, in:{ in0:pbend_in.value }, args: { out_type:uint }, ui:{ create_fl:false } }
          
          etc: {   class: event_trig_ctl, in:{ midi_in:m_in_b.r_out, meas:meas.out, adv_grp_fl:adv_btn.out },
                                        args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/btn_array_cfg.json" },
                                          ui:{create_fl:true, title:"Spirio Trigger Control" } }




          // MIDI out to main application
          m_out_merge: { class:recd_merge, in:{ in0:etc.midi_out, in1:cc23_mm.r_out } }
          m_out_a: { class:midi_out, in:{ rin:m_out_merge.out }, args: { print_fl:false, dev_label:"iRig MIDI 2", port_label:"iRig MIDI 2 MIDI 1" }, ui:{ create_fl:false} },
        }      
      }
    }
  }
}  