
{
  base_dir:    "~/src/cw_proj/rehear_prep/io",
  io_dict:     "~/src/cw_proj/rehear_prep/io.cfg",               // Runtime configuration file.
  proc_dict:   "~/src/caw/src/libcw/src/flow/rsrc/proc_dict.cfg", // Processor class definition file.
  udp_dict:    "~/src/caw/src/libcw/src/flow/rsrc/udp_dict.cfg",  // User defined proc files
  log: { flags:[ date_time, file_out, console, overwrite_file ], level:info, log_filename:"~/temp/caw_log.txt", queue_blk_cnt:16, queue_blk_byte_cnt:4096 }
  tracer: {  trace_cnt:1024, msg_cnt: 1024000, enable_fl:false, activate_fl:false, out_fname:"~/temp/caw_trace/trace" }
    
  programs: {


    ksm_spirio_test_0: {
      network: {
        procs: {

	   meas: { class: number, args: { in:1, out_type:uint }, ui:{ create_fl:true } }

	   tlp: { class: timeline_player, in: {go_meas:meas.out} args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/tl_play.json" }, ui:{ create_fl:true} },


           spirio_mp: { class: multi_player,
                       	  args:{ cfg_fname:"/home/kevin/src/currawong/projects/gutim/gutim_1/caw/multi_player.json",
			         r_play_field:"trigger_id",
                                 start_label:"",
				 restart_fl:false,
                                 play_excl_id:-1 },                            
                          ui: { create_fl:true } },

	   // make the Spirio MP record type conform to the TLP record type
           r_extr: { class:recd_extract, in:{ in:spirio_mp.out }, args:{ out_fmt:{ map:{ midi:midi, mp_meas:meas, mp_port_id:port_id },
	                                                                           fmt:{ alloc_cnt:1024,
										         fields:{
											     midi:{type:m3, doc:"MIDI msg"},
											     meas:{type:uint, doc:"score measure"},
											     port_id:{type:uint, doc:"MIDI source"},
											 }
										        } }
										   } }

	   // merge the Sprio and TLP records									   
           r_merg: { class:recd_merge, in:{ in0:tlp.out, in1:r_extr.out } },
	   

           // Route the incoming MIDI records to a score-follower based on the port id
	   r_route: { class:recd_route, in:{ in:r_merg.out }, args:{ out_cnt:3, sel_field:"port_id" }  },

           sf_a: { class:score_follower_2, in: { in:r_route.out0,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/score.csv",
					        print_fl:false},					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_a: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_a.out, goto_meas:meas.out, sf_done_fl:sf_a.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_a.b_loc, sf_end_loc:sf_a.e_loc, sf_post_gap_sec:sf_a.post_gap_sec, sf_reset_fl:sf_a.reset_trigger },
					   ui: { create_fl:true } },

					   
           sf_b: { class:score_follower_2, in: { in:r_route.out1,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/score.csv",
					        print_fl:false},					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_b: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_b.out, goto_meas:meas.out, sf_done_fl:sf_b.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_b.b_loc, sf_end_loc:sf_b.e_loc, sf_post_gap_sec:sf_b.post_gap_sec, sf_reset_fl:sf_b.reset_trigger },
					   ui: { create_fl:true } },
					   

           sf_c: { class:score_follower_2, in: { in:r_route.out2,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/score.csv",
					        print_fl:false },					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_c: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_c.out, goto_meas:meas.out, sf_done_fl:sf_c.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_c.b_loc, sf_end_loc:sf_c.e_loc, sf_post_gap_sec:sf_c.post_gap_sec, sf_reset_fl:sf_c.reset_trigger },
					   ui: { create_fl:true } },


	   ksm: { class: key_state_monitor, in:{ in0:sf_a.out, in1:sf_b.out, in2:sf_c.out },
	                                  args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/monitor_state.json" },
					  out: { ksm.out:spirio_mp.r_play_id },
					  ui: { create_fl:true } }

					
					

          // m_out_a: { class:midi_out, in:{ rin:r_route.out0 }, args: { print_fl:false, dev_label:"UM-ONE_0", port_label:"UM-ONE MIDI 1" }, ui:{ create_fl:true} },
          // m_out_b: { class:midi_out, in:{ rin:r_route.out1 }, args: { print_fl:false, dev_label:"UM-ONE_1", port_label:"UM-ONE MIDI 1" }, ui:{ create_fl:true} },
	  // m_out_c: { class:midi_out, in:{ rin:r_route.out2 }, args: { print_fl:false, dev_label:"iRig MIDI 2", port_label:"iRig MIDI 2 MIDI 1" }, ui:{ create_fl:true} },
	
	}
      }
    }

    ps_test_1: {
      network: {
        procs: {

	   meas: { class: number, args: { in:1, out_type:uint }, ui:{ create_fl:true } }

	   tlp: { class: timeline_player, in: {go_meas:meas.out} args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/tl_play.json" }, ui:{ create_fl:true} },


           spirio_mp: { class: multi_player,
                       	  args:{ cfg_fname:"/home/kevin/src/currawong/projects/gutim/gutim_2/spirio_mp.json",
			         r_play_field:"trigger_id",
                                 start_label:"",
				 restart_fl:false,
                                 play_excl_id:-1 },                            
                          ui: { create_fl:true } },

	   // make the Spirio MP record type conform to the TLP record type
           r_extr: { class:recd_extract, in:{ in:spirio_mp.out }, args:{ out_fmt:{ map:{ midi:midi, mp_meas:meas, mp_port_id:port_id },
	                                                                           fmt:{ alloc_cnt:1024,
										         fields:{
											     midi:{type:m3, doc:"MIDI msg"},
											     meas:{type:uint, doc:"score measure"},
											     port_id:{type:uint, doc:"MIDI source"},
											 }
										        } }
										   } }

	   // merge the Sprio and TLP records									   
           r_merg: { class:recd_merge, in:{ in0:tlp.out, in1:r_extr.out } },
	   

           // Route the incoming MIDI records to a score-follower based on the port id
	   r_route: { class:recd_route, in:{ in:r_merg.out }, args:{ out_cnt:3, sel_field:"port_id" }  },

           sf_a: { class:score_follower_2, in: { in:r_route.out0,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/score.csv",
					        print_fl:false},					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_a: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_a.out, goto_meas:meas.out, sf_done_fl:sf_a.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_a.b_loc, sf_end_loc:sf_a.e_loc, sf_post_gap_sec:sf_a.post_gap_sec, sf_reset_fl:sf_a.reset_trigger },
					   ui: { create_fl:true } },

					   
           sf_b: { class:score_follower_2, in: { in:r_route.out1,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/score.csv",
					        print_fl:false},					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_b: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_b.out, goto_meas:meas.out, sf_done_fl:sf_b.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_b.b_loc, sf_end_loc:sf_b.e_loc, sf_post_gap_sec:sf_b.post_gap_sec, sf_reset_fl:sf_b.reset_trigger },
					   ui: { create_fl:true } },
					   

           sf_c: { class:score_follower_2, in: { in:r_route.out2,  },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/score.csv",
					        print_fl:false },					                                        
                                  ui: { create_fl:true } },

	   sf_ctl_c: { class: gutim_2_sf_ctl, in:{ sf_loc:sf_c.out, goto_meas:meas.out, sf_done_fl:sf_c.done_fl },	                   
	                                   args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/sf_ctl.json",
					          goto_loc:0 },
					   out:{ sf_beg_loc:sf_c.b_loc, sf_end_loc:sf_c.e_loc, sf_post_gap_sec:sf_c.post_gap_sec, sf_reset_fl:sf_c.reset_trigger },
					   ui: { create_fl:true } },


	   ksm: { class: key_state_monitor, in:{ in0:sf_a.out, in1:sf_b.out, in2:sf_c.out },
	                                  args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_2/monitor_state.json" },
					  out: { ksm.out:spirio_mp.r_play_id },
					  ui: { create_fl:true } }


	   sf_merge: { class: recd_merge, in:{ in0:sf_a.out, in1:sf_b.out, in2:sf_c.out }  }

	   
	   samp_vt:{ class: vel_table, in:{ in:sf_merge.out }, args:{ vel_tbl_fname:"$/../vel_table_perf.json", vel_tbl_label:"ivory" }},

           vctl:   { class: poly_voice_ctl, in:{ in:samp_vt.out , reset:meas.out},
	                                    args:{ seg_cnt:3, midi_fld:"vt_midi", seg_idx_fld:"port_id", voice_cnt:300, prune_thresh:290 },
					    ui: { create_fl:true } },

	   ps_sel_a: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_a.loc_cnt, reset:meas.out },
	                                           preset:"init",
						   args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_2/a/caw/presets.json" },
						   ui: { create_fl:true } },

	   ps_sel_b: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_b.loc_cnt, reset:meas.out },
	                                           preset:"init",
						   args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_2/b/caw/presets.json" },
						   ui: { create_fl:true } },

	   ps_sel_c: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_c.loc_cnt, reset:meas.out },
	                                           preset:"init",
						   args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_2/c/caw/presets.json" },
						   ui: { create_fl:true } },

	   ps_sel_merge: { class:recd_merge, in: { in0:ps_sel_a.out, in1:ps_sel_b.out, in2:ps_sel_c.out },
	                                     ui: { create_fl:true } }


	   ps: { class: emit_preset, in:{ ctl_in:ps_sel_merge.out, midi_in_:vctl.out_ },
	                                  ui: { create_fl:true } }

          xform_igain:  { class: number,   args:{ in:1.0f }, ui: { create_fl:true, vars:{ out_type:{ sfx_id:0, title:"type", flags:[show]}} } },

          voice_poly: {
            class: poly,
            in:   { count:vctl.voice_cnt },               
            args: { parallel_fl:false },

            network: {
              procs: {
                voc: { class:piano_voice, in:{ _.in:_.vctl.out_, _.reset:_.vctl.reset },
                                          out:{ _.done_fl:_.vctl.done_fl_ },
                                          args:{
					         wtb_fname:"~/media/audio/syn_wt/syn_wt_0.json",
					         //wtb_fname:"~/media/audio/wt6/wt_bank.json"
                                                 wtb_instr:"piano",
                                                 rls_coeff: 0.99,
						 rls_thresh:0.01 } },

                g:     { class: audio_gain,       in:{ in:voc.out, gain:_.xform_igain.out }  },
                pva:   { class: pv_analysis,      in:{ in:g.out, enable:voc.gate_fl, _.wndSmpN:_.ps.wnd_smp_cnt_ },  args:{ wndSmpN:512, hopSmpN:128, hzFl:false  } },
                sd:    { class: spec_dist,        in:{ in:pva.out,
                                                       enable:voc.gate_fl,
                                                       _.ceiling:_.ps.ceiling_,
                                                       _.expo:_.ps.expo_,
                                                       _.thresh:_.ps.thresh_,
                                                       _.upr:_.ps.upr_,
                                                       _.lwr:_.ps.lwr_,
                                                       _.mix:_.ps.mix_ },  preset:kc, args:{ bypass:false }   },
                
                pvs:   { class: pv_synthesis,     in:{ in:sd.out, enable:voc.gate_fl  } },
                cmp:   { class: compressor,       in:{ in:pvs.out,
                                                       enable:voc.gate_fl,
                                                       _.igain:_.ps.c_igain_,
                                                       _.ogain:_.ps.c_ogain_ }, preset:kc, args:{ bypass:false }   },
                                                       
                ogain: { class: audio_gain,       in:{ in:cmp.out, _.gain:_.ps.dry_gain_ } },



              }
            }
          }
         
          wet_poly_mix: { class: audio_mix,   in:{ in_:voice_poly.ogain_.out } args:{ igain_:0.5 }},
          dry_poly_mix: { class: audio_mix,   in:{ in_:voice_poly.voc_.out}    args:{ igain_:0.5 }},


          // apply the wet/dry gain balance
          wd_bal:       { class: balance, args:{}},
          wet_bal_gain: { class: audio_gain, in:{ in:wet_poly_mix.out, gain:wd_bal.out }     },
          dry_bal_gain: { class: audio_gain, in:{ in:dry_poly_mix.out, gain:wd_bal.inv_out } },

          mstr_wet_out: { class: audio_gain, in:{ in:wet_bal_gain.out }, args:{ gain:0.5 } }
          mstr_dry_out: { class: audio_gain, in:{ in:dry_bal_gain.out }, args:{ gain:0.5 } },


	  mix: { class: audio_mix, in:{ in0:mstr_wet_out.out, in1:mstr_dry_out.out}, args:{ igain_:0.5 }},
	  
          aout: { class: audio_out,   in:{ in:mix.out },            args:{ dev_label:"main"}, ui:{ create_fl:true } }


	
	}
      }
    }


  }
}
