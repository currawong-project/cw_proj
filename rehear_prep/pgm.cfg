          samp_vt:{ class: vel_table,                  in:{ in:player.out }, args:{ vel_tbl_fname:"$/vel_table_perf.json", vel_tbl_label:"ivory" }},


          vctl:   { class: poly_voice_ctl,             in:{ in:samp_vt.out },  args:{ voice_cnt:30, prune_thresh:15  } },
