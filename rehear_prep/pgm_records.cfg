{
  base_dir:    "~/src/cw_proj/rehear_prep/io",
  io_dict:     "~/src/cw_proj/rehear_prep/io.cfg",               // Runtime configuration file.
  proc_dict:   "~/src/caw/src/libcw/src/flow/rsrc/proc_dict.cfg", // Processor class definition file.
  udp_dict:    "~/src/caw/src/libcw/src/flow/rsrc/udp_dict.cfg",  // User defined proc files
  log: { flags:[ date_time, file_out, console, overwrite_file ], level:info, log_filename:"~/temp/caw_log.txt", queue_blk_cnt:16, queue_blk_byte_cnt:4096 }
  tracer: {  trace_cnt:1024, msg_cnt: 1024000, enable_fl:false, activate_fl:false, out_fname:"~/temp/caw_trace/trace" }
    
  programs: {

   mod_sine: {

      //dur_limit_secs:30.0,  // Run the network for 5 seconds
      //non_real_time_fl: false,
      
      network: {

        procs: {
          lfo:   { class: sine_tone, args:{ hz:3, dc:440, gain:110 }}
          sh:    { class: sample_hold,            in:{ in:lfo.out } }
          osc:   { class: sine_tone, preset:mono, in:{ hz:sh.out } },
          aout:  { class:audio_out, in:{ in:osc.out }, args:{ dev_label:"main"} }
          //af:  { class: audio_file_out, in: { in:osc.out } args:{  fname:"$/out.wav"} }
        }
      }
    }

    recd_pass_test: {
        non_real_time_fl:true,
        dur_limit_secs: 0.25,

        network: {

          procs: {

            r_pass: { class: recd_pass, args:{ fmt:{ alloc_cnt:1024, depth:1, fields:{ trigger_id:{type:uint, doc:"KSM 'trigger_id'"} } } } }

            rp_p: { class: print, in:{ in0:r_pass.out }, args:{ eol_str:"" text:["r_pass:",""], verbosity:all} }
                    

            tmr:   { class: timer,                                  args:{ period_ms:100.0 }, log: { verbosity:silent, flags:[init] varL:[ out ] }},
            cnt:   { class: counter,     in: { trigger:tmr.out },   args:{ min:0, max:4, inc:1, init:0, mode:modulo, out_type:uint } log:{ verbosity:silent, varL:[ out0] }},
            
            rlst:  { class: recd_list,   in: { index:cnt.out },
              out: { out:r_pass.in }
              args: {
                cnt: 1,
                //wrap_fl: true,
                cfg: { fmt: { fields:{ trigger_id  : { type:uint,  value:0, doc:"trigger id"} } } 

                              data: [ { trigger_id:1 },
                                      { trigger_id:2 },
                                      { trigger_id:3 },
                                      { trigger_id:4 },
                                   ]
                       }
              },
            }


          }
        }
    }

    recd_ops: {
    
        non_real_time_fl:true,
        dur_limit_secs: 1.0,
        
        network: {

          procs: {
            tmr:   { class: timer,                                  args:{ period_ms:100.0 }, log: { verbosity:silent, flags:[init] varL:[ out ] }},
            cnt:   { class: counter,     in: { trigger:tmr.out },   args:{ min:0, max:4, inc:1, init:0, mode:modulo, out_type:uint } log:{ verbosity:silent, varL:[ out0] }},

            rlst_a:  { class: recd_list,   in: { index:cnt.out },     
              args: {
                cnt: 2,
                //wrap_fl:true,
                cfg: { fmt: { fields:{ f0  : { type:uint,  value:0, doc:"f0 field"},
                                       f1  : { type:uint,  value:1,  doc:"f1 field"},
                                       sel : { type:uint,  value:-1, doc:"rt selector" }
                                     } },
                                     
                              data: [ { f0:1, f1:10, sel:0 },
                                      { f0:2, f1:20, sel:1 },
                                      { f0:3, f1:30, sel:0 },
                                      { f0:4, f1:40, sel:1 },
                                   ]
                       }
              },
            }

            rlst_b:  { class: recd_list,   in: { index:cnt.out },     
              args: {
                cnt: 1,
                //wrap_fl: true,
                cfg: { fmt: { fields:{ fa  : { type:uint,  value:0, doc:"fa field"},
                                       f1  : { type:uint,  value:1,  doc:"f1 field"},
                                       f2  : { type:float, value:0.0,doc:"f2 field"},
                                       sel : { type:uint,  value:-1, doc:"rt selector" }
                                     } },
                                     
                              data: [ { fa:1, f1:10, f2:300.1, sel:2 },
                                      { fa:2, f1:20, f2:400.2, sel:2 },
                                      { fa:3, f1:30, f2:500.3, sel:2 },
                                      { fa:4, f1:40, f2:600.4, sel:2 },
                                   ]
                       }
              },
            }

            re: { class: recd_rename, in: { in:rlst_b.out }, args:{ out_fmt: {fmt:{ fields:{ fa:f0 } } } }},

            rt: { class: recd_route, in:{ in:rlst_a.out }, args:{ out_cnt:3, sel_field:"sel" } },

            merge: { class: recd_merge, in:{ in0:rt.out0, in1:rt.out1, in2:rt.out2, in3:re.out } },
            
            p_rlst_a: { class: print, in:{ in0:rlst_a.out }, args:{ text:["rlst:",""], verbosity:all} }
            p_rt_a: { class: print, in:{ in0:rt.out0 },      args:{ text:["rt_a:",""], verbosity:all} }
            p_rt_b: { class: print, in:{ in0:rt.out1 },      args:{ text:["rt_b:",""], verbosity:all} }
            p_re:   { class: print, in:{ in0:re.out  },      args:{ text:["re  :",""], verbosity:all} }
            p_merg: { class: print, in:{ in0:merge.out},     args:{ text:["merg:",""], verbosity:all} } 
          },
          
        }
    }  // recd_ops
  }
}