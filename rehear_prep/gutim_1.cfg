{
  base_dir:    "~/src/cw_proj/rehear_prep/io",
  io_dict:     "~/src/cw_proj/rehear_prep/io.cfg",                // Runtime configuration file.
  proc_dict:   "~/src/caw/src/libcw/src/flow/rsrc/proc_dict.cfg", // Processor class definition file.
  udp_dict:    "~/src/caw/src/libcw/src/flow/rsrc/udp_dict.cfg",  // User defined proc files
  log: { flags:[ date_time, file_out, console, overwrite_file ], level:info, log_filename:"~/temp/caw_log.txt", queue_blk_cnt:16, queue_blk_byte_cnt:4096 }
  tracer: {  trace_cnt:1024, msg_cnt: 1024000, enable_fl:false, activate_fl:false, out_fname:"~/temp/caw_trace/trace" }

    
  programs: {
    piano_simul: {
      network: {
        procs: {

           meas_num: { class: number, args: { in:1, out_type:uint }, ui:{ create_fl:true } }
	   meas_map: { class: list,   in:{ in:meas_num.out }, args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/timeline_all/all_meas_meas.json"} }
	   // we use this number box to do type converions from int->uint
	   meas:     { class: number, in:{ in:meas_map.out }, args:{ out_type:uint }  }
	   
           tlp: { class: timeline_player, in: { go_meas:meas.out }, args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/timeline_all/tl_play.json", go_section:"" },
                                         ui:{ create_fl:true} },

           samp_vt:{ class: vel_table, in:{ in:tlp.out }, args:{ vel_tbl_fname:"$/../vel_table_perf.json", vel_tbl_label:"spirio_1" }},

           rt: { class:recd_route, in:{ in:samp_vt.out }, args:{ out_cnt:3, sel_field:"port_id" }  },


           //m_out_a: { class: midi_out, in:{ rin:rt.out0 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"iRig MIDI 2",   port_label:"iRig MIDI 2 MIDI 1" }, ui:{ create_fl:true} },
           //m_out_b: { class: midi_out, in:{ rin:rt.out1 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"UM-ONE_1",      port_label:"UM-ONE MIDI 1" },      ui:{ create_fl:true} },
           //m_out_c: { class: midi_out, in:{ rin:rt.out2 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"UM-ONE_0",      port_label:"UM-ONE MIDI 1" },      ui:{ create_fl:true} },
	   
           m_out_a: { class: midi_out, in:{ rin:rt.out0 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"vt_midi", dev_label:"rtpmidid",    port_label:"mioXM FFC-01" }, ui:{ create_fl:true} },
           m_out_b: { class: midi_out, in:{ rin:rt.out1 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-02" },      ui:{ create_fl:true} },
           m_out_c: { class: midi_out, in:{ rin:rt.out2 }, args:{ in_fld:vt_midi, print_fl:false, dev_label:"rtpmidid",    port_label:"mioXM FFC-03" },      ui:{ create_fl:true} },
        }
      }
    }

    gutim_1_A: {
      network: {
        procs: {


          //m_in_a: { class: midi_in, args:{ port_id:0, print_fl:true, dev_label:"rtpmidid",    port_label:"mioXM FFC-01" }, ui:{create_fl:true} },
          //m_in_b: { class: midi_in, args:{ port_id:1, print_fl:true, dev_label:"rtpmidid",    port_label:"mioXM FFC-02" }, ui:{create_fl:true} },
          //m_in_c: { class: midi_in, args:{ port_id:2, print_fl:true, dev_label:"rtpmidid",    port_label:"mioXM FFC-03" }, ui:{create_fl:true} },
          
          m_in_a: { class: midi_in, args:{ port_id:0, print_fl:true, dev_label:"iRig MIDI 2",   port_label:"iRig MIDI 2 MIDI 1" }, ui:{create_fl:true} },
          m_in_b: { class: midi_in, args:{ port_id:1, print_fl:true, dev_label:"UM-ONE_1",      port_label:"UM-ONE MIDI 1" }, ui:{create_fl:true} },
          m_in_c: { class: midi_in, args:{ port_id:2, print_fl:true, dev_label:"UM-ONE_0",      port_label:"UM-ONE MIDI 1" }, ui:{create_fl:true} },

          sf_a: { class:score_follower_2, in: { in:m_in_a.r_out },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_score.csv",
                                                print_fl:true },                                                                                
                                        ui: { create_fl:true } },

          sf_b: { class:score_follower_2, in: { in:m_in_b.r_out },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_score.csv",
                                                print_fl:true },                                                                                
                                        ui: { create_fl:true } },

          sf_c: { class:score_follower_2, in: { in:m_in_c.r_out },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_score.csv",
                                                print_fl:true },                                                                                
                                        ui: { create_fl:true } },

          sf_merge: { class:recd_merge, in: { in0:sf_a.out, in1:sf_b.out, in2:sf_c.out } },

          seg_menu : { class: label_value_list, args:{ out_type:uint,
                                                       cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/seg_menu.json" },
                                                      ui: { create_fl:true } },

           meas_num: { class: number, args: { in:1, out_type:uint }, ui:{ create_fl:true } }
	   meas_loc: { class: list,   in:{ in:meas_num.out }, args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/meas_loc.json"} }
	   // we use this number box to do type converions from int->uint
	   loc:     { class: number, in:{ in:meas_loc.out }, args:{ out_type:uint }, ui:{create_fl:true}  }


          ctl: { class:gutim_pgm_ctl, in:{ sf_loc:sf_merge.out, goto_seg:seg_menu.out, goto_loc:loc.out }
                                      out:{                                         
                                            sf_a_beg_loc:sf_a.b_loc, sf_a_end_loc:sf_a.e_loc, sf_a_reset_fl:sf_a.reset_trigger, sf_a_enable_fl:sf_a.enable_fl,
                                            sf_b_beg_loc:sf_b.b_loc, sf_b_end_loc:sf_b.e_loc, sf_b_reset_fl:sf_b.reset_trigger, sf_b_enable_fl:sf_b.enable_fl,
                                            sf_c_beg_loc:sf_c.b_loc, sf_c_end_loc:sf_c.e_loc, sf_c_reset_fl:sf_c.reset_trigger, sf_c_enable_fl:sf_c.enable_fl,                                      
                                            },
                                            
                                      args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/gutim_ctl.json"},
                                      ui: { create_fl:true }}

           samp_vt:{ class: vel_table, in:{ in:sf_merge.out }, args:{ vel_tbl_fname:"$/../vel_table_perf.json", vel_tbl_label:"ivory" }},

           vctl:   { class: poly_voice_ctl, in:{ in:samp_vt.out , reset:ctl.reset},
                                             args:{ seg_cnt:3, midi_fld:"vt_midi", seg_idx_fld:"port_id", voice_cnt:300, prune_thresh:290 },
                                            ui: { create_fl:true } },

            ps_sel: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_a.loc_cnt, reset:ctl.reset },
                                                    preset:"init",
                                                    args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/presets.json" },
                                                    ui: { create_fl:true } },
                                                   
            ps: { class: emit_preset, in:{ ctl_in:ps_sel.out, midi_in_:vctl.out_ },
                                          ui: { create_fl:true } }

            xform_igain:  { class: number,   args:{ in:1.0f }, ui: { create_fl:true, vars:{ out_type:{ sfx_id:0, title:"type", flags:[show]}} } },

            voice_poly: {
              class: poly,
              in:   { count:vctl.voice_cnt },               
              args: { parallel_fl:false },

              network: {
                procs: {
                  voc: { class:piano_voice, in:{ _.in:_.vctl.out_, _.reset:_.vctl.reset },
                                           out:{ _.done_fl:_.vctl.done_fl_ },
                                           args:{
                                                 wtb_fname:"~/media/audio/syn_wt/syn_wt_0.json",
                                                 //wtb_fname:"~/media/audio/wt6/wt_bank.json"
                                                  wtb_instr:"piano",
                                                  rls_coeff: 0.95,
                                                 rls_thresh:0.01 } },

                  g:     { class: audio_gain,       in:{ in:voc.out, gain:_.xform_igain.out }  },
                  pva:   { class: pv_analysis,      in:{ in:g.out, enable:voc.gate_fl, _.wndSmpN:_.ps.wnd_smp_cnt_ },  args:{ wndSmpN:512, hopSmpN:128, hzFl:false  } },
                  sd:    { class: spec_dist,        in:{ in:pva.out,
                                                        enable:voc.gate_fl,
                                                        _.ceiling:_.ps.ceiling_,
                                                        _.expo:_.ps.expo_,
                                                        _.thresh:_.ps.thresh_,
                                                        _.upr:_.ps.upr_,
                                                        _.lwr:_.ps.lwr_,
                                                        _.mix:_.ps.mix_ },  preset:kc, args:{ bypass:false }   },
                
                  pvs:   { class: pv_synthesis,     in:{ in:sd.out, enable:voc.gate_fl  } },
                  cmp:   { class: compressor,       in:{ in:pvs.out,
                                                        enable:voc.gate_fl,
                                                        _.igain:_.ps.c_igain_,
                                                        _.ogain:_.ps.c_ogain_ }, preset:kc, args:{ bypass:false }   },
                                                       
                  ogain: { class: audio_gain,       in:{ in:cmp.out, _.gain:_.ps.dry_gain_ } },

              }
            }
          }
         
          wet_poly_mix: { class: audio_mix,   in:{ in_:voice_poly.ogain_.out } args:{ igain_:0.5 }},
          dry_poly_mix: { class: audio_mix,   in:{ in_:voice_poly.voc_.out}    args:{ igain_:0.5 }},

          // apply the wet/dry gain balance
          wd_bal:       { class: balance, args:{}},
          wet_bal_gain: { class: audio_gain, in:{ in:wet_poly_mix.out, gain:wd_bal.out }     },
          dry_bal_gain: { class: audio_gain, in:{ in:dry_poly_mix.out, gain:wd_bal.inv_out } },

          mstr_wet_out: { class: audio_gain, in:{ in:wet_bal_gain.out }, args:{ gain:0.5 } }
          mstr_dry_out: { class: audio_gain, in:{ in:dry_bal_gain.out }, args:{ gain:0.5 } },

          mix: { class: audio_mix, in:{ in0:mstr_wet_out.out, in1:mstr_dry_out.out}, args:{ igain_:0.5 }},
          
          aout: { class: audio_out,   in:{ in:mix.out },            args:{ dev_label:"main"}, ui:{ create_fl:true } }

        }
      } 
    }

    gutim_1_self_test: {
      network: {
        procs: {

          meas: { class: number, args: { in:1, out_type:uint }, ui:{ create_fl:true } }

          tlp: { class: timeline_player, in: { go_meas:meas.out }, args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_play.json", go_section:"" },
                                         ui:{ create_fl:true} },
                                         
          rt: { class:recd_route, in:{ in:tlp.out }, args:{ out_cnt:3, sel_field:"port_id" }  },


          sf_a: { class:score_follower_2, in: { in:rt.out0 },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_score.csv",
                                                print_fl:true },                                                                                
                                        ui: { create_fl:true } },

          sf_b: { class:score_follower_2, in: { in:rt.out1 },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_score.csv",
                                                print_fl:true },                                                                                
                                        ui: { create_fl:true } },

          sf_c: { class:score_follower_2, in: { in:rt.out2 },
                                        args: { score_fname:"~/src/currawong/projects/gutim/gutim_1/caw/tl_score.csv",
                                                print_fl:true },                                                                                
                                        ui: { create_fl:true } },

          sf_merge: { class:recd_merge, in: { in0:sf_a.out, in1:sf_b.out, in2:sf_c.out } },

          seg_menu : { class: label_value_list, args:{ out_type:uint,
                                                       cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/seg_menu.json" },
                                                      ui: { create_fl:true } },

          ctl: { class:gutim_pgm_ctl, in:{ sf_loc:sf_merge.out, goto_seg:seg_menu.out }
                                      out:{                                         
                                            sf_a_beg_loc:sf_a.b_loc, sf_a_end_loc:sf_a.e_loc, sf_a_reset_fl:sf_a.reset_trigger, sf_a_enable_fl:sf_a.enable_fl,
                                            sf_b_beg_loc:sf_b.b_loc, sf_b_end_loc:sf_b.e_loc, sf_b_reset_fl:sf_b.reset_trigger, sf_b_enable_fl:sf_b.enable_fl,
                                            sf_c_beg_loc:sf_c.b_loc, sf_c_end_loc:sf_c.e_loc, sf_c_reset_fl:sf_c.reset_trigger, sf_c_enable_fl:sf_c.enable_fl,                                      
                                            },
                                            
                                      args:{ cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/gutim_ctl.json"},
                                      ui: { create_fl:true }}

           samp_vt:{ class: vel_table, in:{ in:sf_merge.out }, args:{ vel_tbl_fname:"$/../vel_table_perf.json", vel_tbl_label:"ivory" }},

           vctl:   { class: poly_voice_ctl, in:{ in:samp_vt.out , reset:meas.out},
                                             args:{ seg_cnt:3, midi_fld:"vt_midi", seg_idx_fld:"port_id", voice_cnt:300, prune_thresh:290 },
                                            ui: { create_fl:true } },

            ps_sel: { class: ps_class_select, in:{ in:vctl.recd_out, loc_cnt:sf_a.loc_cnt, reset:meas.out },
                                                    preset:"init",
                                                    args:{  cfg_fname:"~/src/currawong/projects/gutim/gutim_1/caw/presets.json" },
                                                    ui: { create_fl:true } },
                                                   
            ps: { class: emit_preset, in:{ ctl_in:ps_sel.out, midi_in_:vctl.out_ },
                                          ui: { create_fl:true } }

            xform_igain:  { class: number,   args:{ in:1.0f }, ui: { create_fl:true, vars:{ out_type:{ sfx_id:0, title:"type", flags:[show]}} } },

            voice_poly: {
              class: poly,
              in:   { count:vctl.voice_cnt },               
              args: { parallel_fl:false },

              network: {
                procs: {
                  voc: { class:piano_voice, in:{ _.in:_.vctl.out_, _.reset:_.vctl.reset },
                                           out:{ _.done_fl:_.vctl.done_fl_ },
                                           args:{
                                                 wtb_fname:"~/media/audio/syn_wt/syn_wt_0.json",
                                                 //wtb_fname:"~/media/audio/wt6/wt_bank.json"
                                                  wtb_instr:"piano",
                                                  rls_coeff: 0.95,
                                                 rls_thresh:0.01 } },

                  g:     { class: audio_gain,       in:{ in:voc.out, gain:_.xform_igain.out }  },
                  pva:   { class: pv_analysis,      in:{ in:g.out, enable:voc.gate_fl, _.wndSmpN:_.ps.wnd_smp_cnt_ },  args:{ wndSmpN:512, hopSmpN:128, hzFl:false  } },
                  sd:    { class: spec_dist,        in:{ in:pva.out,
                                                        enable:voc.gate_fl,
                                                        _.ceiling:_.ps.ceiling_,
                                                        _.expo:_.ps.expo_,
                                                        _.thresh:_.ps.thresh_,
                                                        _.upr:_.ps.upr_,
                                                        _.lwr:_.ps.lwr_,
                                                        _.mix:_.ps.mix_ },  preset:kc, args:{ bypass:false }   },
                
                  pvs:   { class: pv_synthesis,     in:{ in:sd.out, enable:voc.gate_fl  } },
                  cmp:   { class: compressor,       in:{ in:pvs.out,
                                                        enable:voc.gate_fl,
                                                        _.igain:_.ps.c_igain_,
                                                        _.ogain:_.ps.c_ogain_ }, preset:kc, args:{ bypass:false }   },
                                                       
                  ogain: { class: audio_gain,       in:{ in:cmp.out, _.gain:_.ps.dry_gain_ } },

              }
            }
          }
         
          wet_poly_mix: { class: audio_mix,   in:{ in_:voice_poly.ogain_.out } args:{ igain_:0.5 }},
          dry_poly_mix: { class: audio_mix,   in:{ in_:voice_poly.voc_.out}    args:{ igain_:0.5 }},

          // apply the wet/dry gain balance
          wd_bal:       { class: balance, args:{}},
          wet_bal_gain: { class: audio_gain, in:{ in:wet_poly_mix.out, gain:wd_bal.out }     },
          dry_bal_gain: { class: audio_gain, in:{ in:dry_poly_mix.out, gain:wd_bal.inv_out } },

          mstr_wet_out: { class: audio_gain, in:{ in:wet_bal_gain.out }, args:{ gain:0.5 } }
          mstr_dry_out: { class: audio_gain, in:{ in:dry_bal_gain.out }, args:{ gain:0.5 } },

          mix: { class: audio_mix, in:{ in0:mstr_wet_out.out, in1:mstr_dry_out.out}, args:{ igain_:0.5 }},
          
          aout: { class: audio_out,   in:{ in:mix.out },            args:{ dev_label:"main"}, ui:{ create_fl:true } }

        }
      } 
    }


    
  }
}
